<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 320" width="672" height="320">
  <!-- Bild i hjältetelefonens kort: ett webinar på en skärm, i brandkitets färger. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15115f"/>
      <stop offset="1" stop-color="#2a2391"/>
    </linearGradient>
    <clipPath id="screen"><rect x="196" y="58" width="280" height="176" rx="14"/></clipPath>
  </defs>
  <rect width="672" height="320" fill="url(#bg)"/>
  <circle cx="586" cy="54" r="120" fill="#2f7bff" opacity=".22"/>
  <circle cx="70" cy="300" r="140" fill="#efeefc" opacity=".08"/>
  <!-- laptop -->
  <rect x="182" y="44" width="308" height="204" rx="20" fill="#efeefc"/>
  <rect x="196" y="58" width="280" height="176" rx="14" fill="#ffffff"/>
  <g clip-path="url(#screen)">
    <rect x="196" y="58" width="280" height="38" fill="#f5f5fc"/>
    <circle cx="216" cy="77" r="6" fill="#2f7bff"/>
    <rect x="230" y="72" width="96" height="10" rx="5" fill="#15115f" opacity=".85"/>
    <!-- slide: a message card -->
    <rect x="216" y="110" width="126" height="106" rx="12" fill="#efeefc"/>
    <rect x="216" y="110" width="126" height="50" rx="12" fill="#2f7bff"/>
    <rect x="216" y="148" width="126" height="12" fill="#2f7bff"/>
    <rect x="228" y="170" width="84" height="8" rx="4" fill="#15115f"/>
    <rect x="228" y="184" width="62" height="7" rx="3.5" fill="#15115f" opacity=".45"/>
    <rect x="228" y="198" width="102" height="10" rx="5" fill="#ffffff"/>
    <!-- presenter tiles -->
    <rect x="356" y="110" width="104" height="48" rx="10" fill="#f5f5fc"/>
    <circle cx="380" cy="134" r="12" fill="#15115f" opacity=".85"/>
    <rect x="400" y="128" width="46" height="7" rx="3.5" fill="#15115f" opacity=".35"/>
    <rect x="356" y="168" width="104" height="48" rx="10" fill="#f5f5fc"/>
    <circle cx="380" cy="192" r="12" fill="#2f7bff"/>
    <rect x="400" y="186" width="38" height="7" rx="3.5" fill="#15115f" opacity=".35"/>
  </g>
  <rect x="148" y="248" width="376" height="16" rx="8" fill="#efeefc"/>
  <rect x="300" y="248" width="72" height="6" rx="3" fill="#15115f" opacity=".2"/>
  <!-- chat bubbles beside the laptop -->
  <rect x="520" y="150" width="104" height="40" rx="20" fill="#ffffff"/>
  <rect x="538" y="166" width="68" height="8" rx="4" fill="#15115f" opacity=".5"/>
  <rect x="48" y="96" width="110" height="40" rx="20" fill="#2f7bff"/>
  <rect x="66" y="112" width="74" height="8" rx="4" fill="#ffffff"/>
</svg>
